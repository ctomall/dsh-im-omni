# Local HA-shaped stack: two app instances behind nginx, shared Postgres, Redis
# and MinIO. `docker compose -f docker-compose.dev.yml up` then kill one app
# container to watch traffic fail over.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: im_omni
      POSTGRES_USER: im_omni_owner
      POSTGRES_PASSWORD: owner_dev_pw
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im_omni_owner -d im_omni"]
      interval: 5s

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: im_omni
      MINIO_ROOT_PASSWORD: im_omni_dev_pw
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  app1:
    build: .
    environment:
      DATABASE_URL: postgresql://im_omni_app:app_dev_pw@postgres:5432/im_omni
      REDIS_URL: redis://redis:6379
      PORT: "8090"
    depends_on:
      postgres: { condition: service_healthy }

  app2:
    build: .
    environment:
      DATABASE_URL: postgresql://im_omni_app:app_dev_pw@postgres:5432/im_omni
      REDIS_URL: redis://redis:6379
      PORT: "8090"
    depends_on:
      postgres: { condition: service_healthy }

  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app1, app2]

volumes:
  pg:
  minio:

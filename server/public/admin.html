<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队权限 · 全渠道 IM</title>
<link rel="icon" href="data:,">
<style>
:root{
  --base:#fafafa; --layer:#ffffff; --layer2:#f4f4f5;
  --ink:#18181b; --ink2:#71717a; --ink3:#a1a1aa;
  --line:#e6e6e8; --line2:#d4d4d8;
  --green:#15803d; --red:#b91c1c; --amber:#b45309;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--ink);font:14px/1.55 "PingFang SC","Segoe UI",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:40px 24px 64px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
.sub{color:var(--ink2);font-size:13px;margin:0 0 24px}
.card{background:var(--layer);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:600;margin:0 0 4px}
.card p.note{color:var(--ink3);font-size:12px;margin:0 0 16px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2)}
input,select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--base);color:var(--ink);font:inherit;font-size:13px;padding:0 10px;outline:none}
input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:1px}
button{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--layer);color:var(--ink);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
button:hover{background:var(--layer2)}
button.primary{background:var(--green);border-color:transparent;color:#fff}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.who{min-width:0}
.who b{font-weight:500;font-size:13.5px}
.who span{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--ink2);cursor:pointer;user-select:none;background:var(--layer)}
.chip input{width:auto;height:auto;margin:0;accent-color:var(--green)}
.chip.on{color:var(--ink);border-color:var(--line2);background:var(--layer2)}
.confirm{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px;margin:8px 0;border:1px solid var(--line2);border-radius:10px;background:var(--layer2)}
.confirm .who b{font-size:13px}
.confirm .who span{display:block;color:var(--ink2);font-size:11.5px;margin-top:2px}
.status{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.status.ok{color:var(--green)}
.status.bad{color:var(--red)}
.hint{color:var(--ink3);font-size:11.5px;margin-top:10px}
.mono{font-family:var(--mono)}
.hidden{display:none !important}
.matrix{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.matrix th{text-align:left;font-weight:500;color:var(--ink2);font-size:11px;padding:0 0 8px;border-bottom:1px solid var(--line)}
.matrix td{padding:8px 0;border-bottom:1px solid var(--line)}
.matrix tr:last-child td{border-bottom:none}
.matrix .yes{color:var(--ink)}
.matrix .no{color:var(--ink3)}
@media (max-width:720px){.row{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<main>
  <header>
    <h1>团队权限</h1>
    <span class="status" id="session"></span>
  </header>
  <p class="sub">每个员工的可见范围由这里的授权决定：整个团队，或只给指定号码。保存后下一次请求立即生效。</p>

  <section class="card" id="loginCard">
    <h2>登录</h2>
    <p class="note">用团队管理员账号登录，只有所有者和管理员能分配权限。</p>
    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end">
      <label class="field">邮箱<input id="email" type="email" autocomplete="username" value="demo@dsh.local"></label>
      <label class="field">密码<input id="password" type="password" autocomplete="current-password" value="demo12345"></label>
      <button class="primary" id="loginBtn">登录</button>
    </div>
    <p class="hint" id="loginMsg"></p>
  </section>

  <section class="card hidden" id="teamCard">
    <h2>成员</h2>
    <p class="note" id="teamNote"></p>
    <div id="members"></div>
  </section>

  <section class="card hidden" id="historyCard">
    <h2>最近变更</h2>
    <p class="note">谁在什么时候把哪个成员的可见范围改成了什么。</p>
    <div id="history"></div>
  </section>

  <section class="card hidden" id="matrixCard">
    <h2>权限说明</h2>
    <table class="matrix">
      <thead><tr><th>能力</th><th>所有者 / 管理员</th><th>客服</th><th>客服 + 指定号码</th></tr></thead>
      <tbody>
        <tr><td>查看全部渠道号码</td><td class="yes">✓</td><td class="no">—</td><td class="no">—</td></tr>
        <tr><td>查看被授权的号码</td><td class="yes">✓</td><td class="no">—</td><td class="yes">✓</td></tr>
        <tr><td>接待被授权号码上的会话</td><td class="yes">✓</td><td class="no">—</td><td class="yes">✓</td></tr>
        <tr><td>分配成员权限</td><td class="yes">✓</td><td class="no">—</td><td class="no">—</td></tr>
      </tbody>
    </table>
  </section>
</main>
<script>
const state = { token: '', tenantId: '', role: '', channels: [], members: [] }

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      'content-type': 'application/json',
      ...(state.token === '' ? {} : { authorization: 'Bearer ' + state.token }),
      ...(options.headers ?? {}),
    },
  })
  const body = await response.json().catch(() => null)
  if (!response.ok) {
    const failure = new Error(body?.error?.message ?? ('HTTP ' + response.status))
    failure.code = body?.error?.code
    throw failure
  }
  return body
}

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag)
  for (const [key, value] of Object.entries(props)) {
    if (key === 'class') node.className = value
    else if (key === 'text') node.textContent = value
    else if (key.startsWith('on')) node.addEventListener(key.slice(2).toLowerCase(), value)
    else node.setAttribute(key, value)
  }
  for (const child of children) {
    if (child === null || child === undefined || child === false) continue
    node.append(child)
  }
  return node
}

function setStatus(text, kind = '') {
  const node = document.getElementById('session')
  node.textContent = text
  node.className = 'status ' + kind
}

async function login() {
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  document.getElementById('loginMsg').textContent = ''
  try {
    const session = await api('/v1/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) })
    state.token = session.accessToken
    const me = await api('/v1/me')
    const tenant = me.tenants.find((item) => item.tenant_id === me.currentTenant) ?? me.tenants[0]
    state.tenantId = tenant.tenant_id
    state.role = tenant.role
    setStatus((me.user.name || me.user.email) + ' · ' + (tenant.role === 'owner' ? '所有者' : tenant.role === 'admin' ? '管理员' : '客服'))
    await loadTeam()
  } catch (error) {
    document.getElementById('loginMsg').textContent = '登录失败：' + error.message
    setStatus('未登录', 'bad')
  }
}

async function loadTeam() {
  const [members, channels] = await Promise.all([
    api('/v1/tenants/' + state.tenantId + '/members'),
    api('/v1/channels'),
  ])
  state.members = members.items
  state.channels = channels.items
  const canAssign = state.role === 'owner' || state.role === 'admin'
  if (canAssign) {
    try {
      const audit = await api('/v1/tenants/' + state.tenantId + '/audit?limit=8')
      renderHistory(audit.items)
    } catch {
      renderHistory([])
    }
  }
  document.getElementById('loginCard').classList.add('hidden')
  document.getElementById('teamCard').classList.remove('hidden')
  document.getElementById('matrixCard').classList.remove('hidden')
  document.getElementById('teamNote').textContent = canAssign
    ? state.members.length + ' 名成员 · ' + state.channels.length + ' 个号码可见'
    : '只有所有者和管理员能修改权限，这里只读。'
  renderMembers(canAssign)
}

let confirmState = null

function openRole(member, nextRole) {
  confirmState = { member, kind: 'role', nextRole }
  renderMembers(state.role === 'owner')
}

function openRemove(member) {
  confirmState = { member, kind: 'remove' }
  renderMembers(state.role === 'owner')
}

function openConfirm(member, select) {
  confirmState = { member, kind: 'scope' }
  renderMembers(state.role === 'owner' || state.role === 'admin')
}

function closeConfirm() {
  confirmState = null
  renderMembers(state.role === 'owner' || state.role === 'admin')
}

function renderConfirm() {
  const member = confirmState.member
  const isRemove = confirmState.kind === 'remove'
  const isRole = confirmState.kind === 'role'
  const nextRole = confirmState.nextRole

  const input = el('input', { placeholder: '输入该成员邮箱', style: 'max-width:260px' })
  const error = el('span', { class: 'status bad' })
  const confirm = el('button', {
    class: 'primary',
    onclick: async () => {
      if (input.value.trim().toLowerCase() !== member.email.toLowerCase()) {
        error.textContent = '邮箱不一致'
        return
      }
      confirm.setAttribute('disabled', 'disabled')
      if (isRole) {
        try {
          await api('/v1/tenants/' + state.tenantId + '/members/' + member.user_id, {
            method: 'PATCH',
            body: JSON.stringify({ role: nextRole, confirmEmail: input.value.trim() }),
          })
          confirmState = null
          await loadTeam()
        } catch (error) {
          error.textContent = '保存失败：' + error.message
          confirm.removeAttribute('disabled')
        }
        return
      }
      if (isRemove) {
        try {
          await api('/v1/tenants/' + state.tenantId + '/members/' + member.user_id + '?confirmEmail=' + encodeURIComponent(input.value.trim()), { method: 'DELETE' })
          confirmState = null
          await loadTeam()
        } catch (error) {
          error.textContent = '移除失败：' + error.message
          confirm.removeAttribute('disabled')
        }
        return
      }
      await save(member, { dataScope: 'all', channelIds: [], confirmEmail: input.value.trim() })
      confirmState = null
      renderMembers(true)
    },
  }, isRemove ? '确认移除' : isRole ? '确认改角色' : '确认放开')
  return el('div', { class: 'confirm' },
    el('div', { class: 'who' },
      el('b', {
        text: isRemove
          ? '移除 ' + (member.name || member.email) + '？'
          : isRole
            ? '把 ' + (member.name || member.email) + ' 改成' + (nextRole === 'admin' ? '管理员' : '客服') + '？'
            : '把 ' + (member.name || member.email) + ' 设成整个团队？',
      }),
      el('span', {
        text: isRemove
          ? '移除后这个账号立即失去该团队的访问，历史记录保留。输入对方邮箱确认。'
          : isRole
            ? (nextRole === 'admin' ? '管理员可以分配权限、暂停渠道，并看到整个团队的号码。' : '改回客服后，只能看到自己名下的号码。') + '输入对方邮箱确认。'
            : '这会让他看到所有渠道号码与全部会话。输入对方邮箱确认。',
      }),
    ),
    el('div', { style: 'display:flex;align-items:center;gap:8px;flex-wrap:wrap' },
      input,
      confirm,
      el('button', { onclick: closeConfirm }, '取消'),
      error,
    ),
  )
}

function renderMembers(canAssign) {
  const host = document.getElementById('members')
  host.textContent = ''
  for (const member of state.members) {
    const permission = member.permissions ?? {}
    const scope = permission.dataScope === 'all' ? 'all' : permission.dataScope === 'own' ? 'own' : ''
    const granted = new Set(permission.channelIds ?? [])
    const isAdminRole = member.role === 'owner' || member.role === 'admin'
    const allVisible = scope === 'all' || (scope === '' && isAdminRole)
    const effective = allVisible ? '整个团队' : granted.size > 0 ? granted.size + ' 个号码' : '仅自己'

    const scopeSelect = el('select', {
      ...(canAssign ? {} : { disabled: 'disabled' }),
      onchange: (event) => {
        if (event.target.value === 'all') {
          openConfirm(member, event.target)
          return
        }
        save(member, { dataScope: 'own', channelIds: [...granted] })
      },
    },
      el('option', { value: 'own', ...(!allVisible ? { selected: 'selected' } : {}) }, '仅自己'),
      el('option', { value: 'all', ...(allVisible ? { selected: 'selected' } : {}) }, '整个团队'),
    )

    const chips = el('div', { class: 'chips' })
    if (!allVisible) {
      for (const channel of state.channels) {
        const box = el('input', { type: 'checkbox', ...(granted.has(channel.id) ? { checked: 'checked' } : {}) })
        if (!canAssign) box.setAttribute('disabled', 'disabled')
        box.addEventListener('change', () => {
          const next = new Set(granted)
          if (box.checked) next.add(channel.id)
          else next.delete(channel.id)
          save(member, { channelIds: [...next], ...(scope === 'all' ? {} : { dataScope: 'own' }) })
        })
        chips.append(el('label', { class: 'chip' + (granted.has(channel.id) ? ' on' : '') }, box, channel.name))
      }
      if (state.channels.length === 0) chips.append(el('span', { class: 'status' }, '还没有渠道'))
    }

    const row = el('div', { class: 'row' },
      el('div', { class: 'who' },
        el('b', { text: member.name || member.email }),
        el('span', { text: member.email }),
        ...(allVisible ? [] : [chips]),
      ),
      el('div', { style: 'display:flex;align-items:center;gap:12px;flex:none' },
        el('span', { class: 'status', text: effective }),
        scopeSelect,
        state.role === 'owner' && member.role !== 'owner'
          ? el('select', {
            onchange: (event) => {
              const next = event.target.value
              event.target.value = member.role
              openRole(member, next)
            },
          },
            el('option', { value: 'agent', ...(member.role === 'agent' ? { selected: 'selected' } : {}) }, '客服'),
            el('option', { value: 'admin', ...(member.role === 'admin' ? { selected: 'selected' } : {}) }, '管理员'),
          )
          : null,
        state.role === 'owner' && member.role !== 'owner'
          ? el('button', { onclick: () => openRemove(member) }, '移除')
          : null,
      ),
    )
    host.append(row)
    if (confirmState !== null && confirmState.member.user_id === member.user_id) {
      host.append(renderConfirm())
    }
  }
}

function describe(item) {
  const detail = item.detail ?? {}
  const grant = detail.grant ?? {}
  if (item.action === 'member.join') return '加入团队 · ' + (detail.role ?? 'agent')
  if (item.action === 'member.remove') return '移出团队'
  if (item.action === 'member.role') return '角色改为 ' + (grant.role ?? '未知')
  const parts = []
  if (grant.dataScope === 'all') parts.push('整个团队')
  if (grant.dataScope === 'own') parts.push('仅自己')
  if (Array.isArray(grant.channelIds)) parts.push(grant.channelIds.length === 0 ? '号码全部收回' : grant.channelIds.length + ' 个号码')
  return parts.join(' · ') || '未变更'
}

function renderHistory(items) {
  const card = document.getElementById('historyCard')
  const host = document.getElementById('history')
  host.textContent = ''
  if (items.length === 0) {
    card.classList.add('hidden')
    return
  }
  card.classList.remove('hidden')
  for (const item of items) {
    host.append(el('div', { class: 'row' },
      el('div', { class: 'who' },
        el('b', { text: (item.actor_name || item.actor_email || '未知操作人') + ' → ' + (item.target_name || item.target_email || item.target) }),
        el('span', { text: describe(item) }),
      ),
      el('span', { class: 'status mono', text: new Date(item.created_at).toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) }),
    ))
  }
}

async function save(member, patch) {
  try {
    const result = await api('/v1/tenants/' + state.tenantId + '/members/' + member.user_id, {
      method: 'PATCH',
      body: JSON.stringify(patch),
    })
    member.permissions = result.member.permissions
    await loadTeam()
  } catch (error) {
    setStatus('保存失败：' + error.message, 'bad')
  }
}

document.getElementById('loginBtn').addEventListener('click', login)
document.getElementById('password').addEventListener('keydown', (event) => { if (event.key === 'Enter') login() })
</script>
</body>
</html>
